<!-- This tag indicates that this file extends the base template -->
{% extends "base2.html" %}

<!-- This block named ‘content’ allows us to define html that can be inserted into the base template block with the same name -->
{% block content %}

<!-- This is the template contents that will be inserted into the {block} 'content' in base.html including a dynamic 'username' -->
<div class="landing-mid-div">
    <h2 class="landing-mid-text-style">Uk's Number 1 Tenancy Takeover Socials.</h2>
    <hr>
    <h5 class="landing-mid-text-style">Browse suitable deals. Chat with the tenant</h5>

    <form method="GET">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="row">
            <div class="d-grid col-md-8 searchbox-div">

                <div class="form-floating mb-2">
                    <input name="username" type="text" class="form-control" id="username" placeholder="username"
                        value="{{ request.form['username'] }}">
                    <label for="username">Search deals</label>
                </div>
            </div>
            <div class="d-grid col-md-2 search_button-size">
                <button type="submit" class="btn btn-secondary">Search</button>
            </div>
        </div>

        <!-- <div class="container-sm searchbox">
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Recipient's username"
                    aria-label="Recipient's username" aria-describedby="button-addon2">
                <button class="btn btn-outline-secondary" type="button" id="button-addon2">Button</button>
            </div>
        </div> -->

    </form>
</div>
{% endblock %}
